<!DOCTYPE html>
<html>

<head>
    <!-- Office JavaScript API -->
    <script type="text/javascript" src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js"></script>
</head>

<body>
    <p>Before clicking button, try first Ctrl+Shift+Alt+T as defined in default json shortcuts.</p>
    <div id="output"></div>
    <button id="firstButton">Change action from Ctrl+Shift+Alt+T to Ctrl+Shift+Alt+K</button>
</body>

<script>
    Office.onReady((info) => {
        if (info.host === Office.HostType.Excel) {
            Office.actions.associate('action1', actionOne);
            document.getElementById("firstButton").onclick = firstButton;
            document.getElementById("output").innerHTML = 'Ready - try Ctrl+Shift+Alt+T';
        }
    });

    async function firstButton() {
        const shortcutsInUse = await Office.actions.areShortcutsInUse(['Ctrl+Shift+Alt+K']);
        document.getElementById("output").innerHTML = `Shortcuts in use: ${JSON.stringify(shortcutsInUse)}<br>Replacing shortcuts...`;
        await Office.actions.replaceShortcuts({ action1: 'Ctrl+Shift+Alt+K' });
        document.getElementById("output").innerHTML += '<br>Now try Ctrl+Shift+Alt+K';
    }

    function actionOne() {
        console.log('>>> ACTION ONE TRIGGERED');
        document.getElementById("output").innerHTML += '<br>✅ Shortcut triggered successfully!';
    }
</script>

</html>
